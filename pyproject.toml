[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobrain"
version = "0.1.0"
description = "Local notes memory with cited evidence and verifiable application deletion"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
neurobrain = "neurobrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurobrain = ["index.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
